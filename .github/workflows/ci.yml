name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The smoke-api check only needs /health; skip the background embedding-model
      # download so CI does not waste time and bandwidth on every run.
      API_PRELOAD_MODELS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt
      - name: Run Python test suite
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  real-integration:
    name: Real API integration regressions
    runs-on: ubuntu-latest
    needs: python-tests
    env:
      API_PRELOAD_MODELS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt
      - name: Exercise FastAPI, SQLite, streaming cleanup, and image lifecycle
        run: >-
          python -m pytest -q
          test_api_server.py::test_real_fastapi_sqlite_mood_and_model_response_roundtrip
          test_api_server.py::test_stream_disconnect_during_send_releases_lock
          test_api_server.py::test_mood_checkin_images_are_private_and_removed_with_the_record
          test_mood_image_store.py
          test_user_data_import.py::test_failed_replace_rolls_back_instead_of_leaving_half_the_account

  deployment-check:
    needs: [python-tests, frontend, real-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_PRELOAD_MODELS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/runtime.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run API smoke and deployment checks
        run: python deployment_check.py --skip-dependencies --smoke-api --frontend-build
