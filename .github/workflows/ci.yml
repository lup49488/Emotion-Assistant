name: Test and deploy checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The smoke-api check only needs /health; skip the background embedding-model
      # download so CI does not waste time and bandwidth on every run.
      API_PRELOAD_MODELS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run deployment checks
        run: python deployment_check.py --skip-dependencies --smoke-api --frontend-build
