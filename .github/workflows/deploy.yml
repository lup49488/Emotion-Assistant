name: Deploy Emotion Assistant

on:
  # Deploy only after CI has passed on main, so a red test suite never ships.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy. Leave empty to deploy the current origin/main tip.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: emotion-assistant-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_run fires for failed runs too; a manual dispatch has no conclusion.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keygen -lf ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          printf 'StrictHostKeyChecking yes\nUserKnownHostsFile ~/.ssh/known_hosts\nIdentitiesOnly yes\nBatchMode yes\nConnectTimeout 15\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH authentication
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PORT"
          echo "Testing SSH login for ${VPS_USER}@${VPS_HOST}:${VPS_PORT}"
          ssh \
            -vv \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            "$VPS_USER@$VPS_HOST" \
            "echo ssh-auth-ok"

      - name: Deploy to VPS
        id: deploy_revision
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}
        run: |
          # A workflow_run always carries a SHA; a manual dispatch may leave it
          # empty, which the VPS resolves to the current origin/main tip.
          if [ -n "$DEPLOY_SHA" ] && ! [[ "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ -z "$DEPLOY_SHA" ]; then
            echo "workflow_run did not provide a head SHA." >&2
            exit 1
          fi
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" << 'EOF'
              set -euo pipefail

              cd /opt/Emotion-Assistant

              echo "Resolving CI-verified deployment revision..."
              previous_sha="$(git rev-parse HEAD)"
              git fetch origin main
              if [ -z "$DEPLOY_SHA" ]; then
                DEPLOY_SHA="$(git rev-parse origin/main)"
                echo "No commit SHA supplied; deploying the origin/main tip $DEPLOY_SHA."
              fi
              git cat-file -e "${DEPLOY_SHA}^{commit}"
              git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
              git checkout --detach "$DEPLOY_SHA"
              deployed_sha="$(git rev-parse HEAD)"
              test "$deployed_sha" = "$DEPLOY_SHA"

              echo "Validating Docker Compose configuration..."
              docker compose config --quiet

              echo "Building and starting Docker services..."
              docker compose up --build -d

              echo "Checking Docker services..."
              docker compose ps

              echo "Running deployment health checks..."
              app_host="$(grep -E '^API_TRUSTED_HOSTS=' .env | head -n 1 | cut -d= -f2- | cut -d, -f1 | tr -d '\r\n')"
              test -n "$app_host"
              python3 deployment_check.py \
                --skip-dependencies \
                --docker-runtime \
                --local-docker-http \
                --public-url "https://${app_host}/" \
                --cloudflared

              # Recorded for the manual rollback procedure documented in
              # DEPLOYMENT_CLOUDFLARE.md; no workflow step reads these back.
              state_directory=/opt/Emotion-Assistant/.deployment
              mkdir -p "$state_directory"
              printf '%s\n' "$previous_sha" > "$state_directory/previous_sha"
              printf '%s\n' "$deployed_sha" > "$state_directory/current_sha"
              echo "Deployment completed. current=$deployed_sha previous=$previous_sha"
          EOF

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
