[pytest]
testpaths = .
python_files = test_*.py
# Runtime and cache directories hold no tests. HF_HOME points at data/hf_cache,
# whose symlinked snapshots make collection fail outright on Windows.
norecursedirs =
    .git
    .venv
    data
    users
    exports
    logs
    knowledge_base
    style_base
    frontend
