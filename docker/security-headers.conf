# Response headers shared by every location. Nginx drops server-level add_header
# directives in any location that declares its own, so each such location must
# include this file again.

# Browsers must not let other sites frame the app (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Cloudflare terminates TLS, so the browser receives this over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Enforced: directives that cannot affect how the app itself loads.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
# Observed only: the full allowlist, so a missed source shows up as a console
# report instead of a broken page. Enforce it once the reports are clean.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
