server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx defaults to 1 MB, which would reject knowledge-base uploads and data
    # imports before they reach the API. Keep this aligned with API_MAX_REQUEST_BYTES.
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append ($proxy_add_x_forwarded_for): the appended
        # form keeps a client-supplied value first, which would let a caller forge
        # the address the login rate limiter keys on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /health/live {
        proxy_pass http://api:8000/health/live;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
