services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file:
      - .env
    environment:
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8000
      # Secret values are mounted as files and loaded by env_loader.py. Remove
      # the corresponding populated entries from .env after migration.
      API_SESSION_SECRET_FILE: /run/secrets/api_session_secret
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      NVIDIA_NIM_API_KEY_FILE: /run/secrets/nvidia_nim_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      HF_TOKEN_FILE: /run/secrets/hf_token
      CHATBOT_ADMIN_RECOVERY_KEY_FILE: /run/secrets/chatbot_admin_recovery_key
      DIALOGUE_REGRESSION_ACCESS_KEY_FILE: /run/secrets/dialogue_regression_access_key
      API_PUBLIC_MODE: ${API_PUBLIC_MODE:-false}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      API_TRUSTED_HOSTS: ${API_TRUSTED_HOSTS:-localhost,127.0.0.1,[::1]}
      # The api service is only reachable through the web service, and Nginx
      # overwrites the address headers, so the forwarded address is trustworthy.
      # Without this every caller shares the Nginx container IP and one attacker
      # could hold any known account inside the login rate limit.
      API_TRUST_PROXY_HEADERS: ${API_TRUST_PROXY_HEADERS:-true}
      # The interactive OpenAPI page is off unless explicitly requested, since
      # Nginx proxies /docs to whatever the API exposes.
      API_ENABLE_DOCS: ${API_ENABLE_DOCS:-false}
      HF_HOME: /app/data/hf_cache
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      SQLITE_DATABASE_PATH: ${SQLITE_DATABASE_PATH:-/app/data/chatbot.db}
    volumes:
      - ./data:/app/data
      - ./users:/app/users
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./knowledge_base:/app/knowledge_base
      - ./style_base:/app/style_base
    expose:
      - "8000"
    # Keep enough headroom on a 4 GB VPS for Docker, cloudflared and the OS.
    # Override in .env after measuring the host under realistic traffic.
    mem_limit: ${API_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import Request, urlopen; host=(os.getenv('API_TRUSTED_HOSTS') or 'localhost').split(',')[0].strip() or 'localhost'; urlopen(Request('http://127.0.0.1:8000/health/ready', headers={'Host': host}), timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    secrets:
      - api_session_secret
      - llm_api_key
      - openai_api_key
      - openrouter_api_key
      - deepseek_api_key
      - nvidia_nim_api_key
      - anthropic_api_key
      - hf_token
      - chatbot_admin_recovery_key
      - dialogue_regression_access_key

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    restart: unless-stopped

secrets:
  api_session_secret:
    file: ./secrets/api_session_secret.txt
  llm_api_key:
    file: ./secrets/llm_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  deepseek_api_key:
    file: ./secrets/deepseek_api_key.txt
  nvidia_nim_api_key:
    file: ./secrets/nvidia_nim_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  hf_token:
    file: ./secrets/hf_token.txt
  chatbot_admin_recovery_key:
    file: ./secrets/chatbot_admin_recovery_key.txt
  dialogue_regression_access_key:
    file: ./secrets/dialogue_regression_access_key.txt
